name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: LightGBM runtime
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install
        run: pip install -r requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check hishab tests
      - name: Tests + coverage
        env:
          LLM_ENABLED: "false"
          HISHAB_DB_PATH: ${{ runner.temp }}/hishab.db
        run: >
          pytest -q --timeout=600 --cov=hishab --cov-report=xml --cov-report=term-missing:skip-covered
          --cov-fail-under=85 --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/junit.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hishab:ci .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name hishab hishab:ci
          for i in $(seq 40); do
            if curl -fs localhost:8000/api/health; then exit 0; fi
            sleep 3
          done
          docker logs hishab
          exit 1
