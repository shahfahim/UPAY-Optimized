[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hishab"
version = "0.1.0"
description = "Hishab: AI cash-flow copilot prototype for upay (AI DEV FEST 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pandas",
    "numpy",
    "pyarrow",
    "lightgbm",
    "scikit-learn",
    "pyyaml",
    "anthropic",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-timeout", "ruff"]

[tool.setuptools.packages.find]
include = ["hishab*"]

[tool.setuptools.package-data]
"hishab" = ["rules/*.yaml", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# One-line `if x: return` guards and `l` loop names are used across the engine; keep them for now.
ignore = ["E701", "E741", "E402"]
