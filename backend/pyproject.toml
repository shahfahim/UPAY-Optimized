[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hishab"
version = "0.1.0"
description = "Hishab: AI cash-flow copilot prototype for upay (AI DEV FEST 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pandas",
    "numpy",
    "pyarrow",
    "lightgbm",
    "scikit-learn",
    "pyyaml",
    "anthropic",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hishab*"]

[tool.setuptools.package-data]
"hishab" = ["rules/*.yaml", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--basetemp=.pytest_tmp"
